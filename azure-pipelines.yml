variables:
  buildContainerImage: 'mcr.microsoft.com/dotnet/sdk:10.0'
  projectName: Eiliko.Blazor.hCaptcha
  buildConfiguration: 'Release'

trigger:
- master

# Validation build for pull requests. GitHub-backed pipelines have PR triggers on by
# default; declaring it makes the contract explicit, because Dependabot auto-merge is
# gated on this pipeline's status check reaching the PR.
pr:
- master

pool:
  name: 'Builders'
  demands: 
    - docker

stages:
  - stage: Build
    displayName: Build Nuget package
    jobs:
      - job: Build
        container:
          image: $(buildContainerImage)
        steps:
        # GitVersion needs the full history and tags, not the default shallow fetch.
        - checkout: self
          fetchDepth: 0
          fetchTags: true
        - task: CmdLine@2
          displayName: 'Compute version (GitVersion)'
          inputs:
            # safe.directory: the checkout is owned by the host agent user, not the container user.
            # "/output buildserver" sets GitVersion.* pipeline variables and the build number.
            script: |
              git config --global --add safe.directory '*'
              dotnet tool restore
              dotnet gitversion /output buildserver
        # Pack must not build: a clean "dotnet pack" on this Razor class library fails with a missing
        # staticwebassets.build.json manifest, so build first and pack the existing output.
        - task: CmdLine@2
          displayName: 'Build'
          inputs:
            script: >-
              dotnet build $(projectName).sln
              --configuration $(buildConfiguration)
              -p:Version=$(GitVersion.SemVer)
              -p:InformationalVersion=$(GitVersion.InformationalVersion)
        - task: CmdLine@2
          displayName: 'Pack'
          inputs:
            script: >-
              dotnet pack $(projectName).sln
              --configuration $(buildConfiguration)
              --no-build
              --output $(Build.ArtifactStagingDirectory)
              -p:Version=$(GitVersion.SemVer)
              -p:InformationalVersion=$(GitVersion.InformationalVersion)
        # PR builds exist to prove the change compiles and packs; only master produces
        # an artifact worth keeping.
        - task: PublishBuildArtifacts@1
          displayName: 'Publish Artifact'
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)'
