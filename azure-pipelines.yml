variables:
  buildContainerImage: 'mcr.microsoft.com/dotnet/sdk:10.0'
  projectName: Eiliko.Blazor.hCaptcha
  buildConfiguration: 'Release'
  # Set to 'true' once the NuGetApiKey secret exists to publish release candidates
  # automatically. Left off so a release build cannot fail on a missing secret, and so
  # publishing to a public feed is always a deliberate choice.
  publishReleaseCandidates: 'false'

trigger:
- master
- release/*

# Validation build for pull requests. GitHub-backed pipelines have PR triggers on by
# default; declaring it makes the contract explicit, because Dependabot auto-merge is
# gated on this pipeline's status check reaching the PR.
pr:
- master

pool:
  name: 'Builders'
  demands: 
    - docker

stages:
  - stage: Build
    displayName: Build Nuget package
    jobs:
      - job: Build
        container:
          image: $(buildContainerImage)
        steps:
        # GitVersion needs the full history and tags, not the default shallow fetch.
        - checkout: self
          fetchDepth: 0
          fetchTags: true
        - task: CmdLine@2
          displayName: 'Compute version (GitVersion)'
          inputs:
            # safe.directory: the checkout is owned by the host agent user, not the container user.
            # "/output buildserver" sets GitVersion.* pipeline variables and the build number.
            script: |
              git config --global --add safe.directory '*'
              dotnet tool restore
              dotnet gitversion /output buildserver
        # Pack must not build: a clean "dotnet pack" on this Razor class library fails with a missing
        # staticwebassets.build.json manifest, so build first and pack the existing output.
        - task: CmdLine@2
          displayName: 'Build'
          inputs:
            script: >-
              dotnet build $(projectName).sln
              --configuration $(buildConfiguration)
              -p:Version=$(GitVersion.SemVer)
              -p:InformationalVersion=$(GitVersion.InformationalVersion)
        - task: CmdLine@2
          displayName: 'Pack'
          inputs:
            script: >-
              dotnet pack $(projectName).sln
              --configuration $(buildConfiguration)
              --no-build
              --output $(Build.ArtifactStagingDirectory)
              -p:Version=$(GitVersion.SemVer)
              -p:InformationalVersion=$(GitVersion.InformationalVersion)
        # PR builds exist to prove the change compiles and packs. master and release
        # branches produce artifacts worth keeping; release/* is how an rc package is
        # produced for testing before a stable version ships.
        - task: PublishBuildArtifacts@1
          displayName: 'Publish Artifact'
          condition: >-
            and(succeeded(), or(
              eq(variables['Build.SourceBranch'], 'refs/heads/master'),
              startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')))
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        # Publish release candidates automatically so they can be installed for testing
        # without downloading the artifact and pushing it by hand.
        #
        # Only release/* reaches this step. master and pull requests never push, so a
        # stable version is still released deliberately.
        #
        # Off by default. Enabling it takes two deliberate steps: add a secret pipeline
        # variable named NuGetApiKey, then set publishReleaseCandidates to 'true'. The
        # gate is a plain variable because secrets are not readable in conditions, so the
        # step could not otherwise skip itself when the key is absent.
        #
        # --skip-duplicate keeps a re-run from failing on a version already published.
        # NuGet.org versions cannot be deleted, only unlisted, so every commit on a
        # release branch permanently consumes a public version number.
        - task: CmdLine@2
          displayName: 'Push package to NuGet'
          condition: >-
            and(succeeded(),
              eq(variables['publishReleaseCandidates'], 'true'),
              startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))
          env:
            NUGET_API_KEY: $(NuGetApiKey)
          inputs:
            script: >-
              dotnet nuget push "$(Build.ArtifactStagingDirectory)/*.nupkg"
              --source https://api.nuget.org/v3/index.json
              --api-key "$NUGET_API_KEY"
              --skip-duplicate
